name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must each be between 0 and 999." >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "The calculated Android versionCode is outside the supported range." >&2
            exit 1
          fi

          echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          for secret_name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required repository secret $secret_name is not configured." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/notification-overlay-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          echo "ANDROID_SIGNING_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: >-
          ./gradlew --no-daemon
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          mkdir -p dist
          asset_name="notification-icons-overlay-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$asset_name"
          cd dist
          sha256sum "$asset_name" > "$asset_name.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*
          --verify-tag
          --generate-notes
          --title "Notification Icons Overlay ${{ steps.version.outputs.name }}"
